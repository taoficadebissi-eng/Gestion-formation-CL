<!DOCTYPE html>

<html>

<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description" content="Gestion Formation - Application multi-centre">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="apple-mobile-web-app-title" content="Gestion Formation">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="dns-prefetch" href="https://firestore.googleapis.com">

  <link rel="dns-prefetch" href="https://www.googleapis.com">

  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">

  <link rel="preconnect" href="https://firestore.googleapis.com">

  <link rel="preconnect" href="https://www.googleapis.com">

  <title>Gestion Formation</title>

  <link rel="manifest" href="manifest.json">



  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #16223D; }
    #splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: linear-gradient(160deg, #0F1830 0%, #16223D 55%, #973D12 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.35s ease-out;
    }
    #splash-screen.hidden { opacity: 0; pointer-events: none; }
    .splash-icon { width: 72px; height: 72px; margin-bottom: 20px; }
    .splash-title { color: #F7ECD9; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .splash-subtitle { color: #FFCF80; font-size: 12px; margin-top: 8px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; }
    .spinner {
      margin-top: 36px; width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.18); border-top-color: #F2A93C;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash-screen">
    <svg class="splash-icon" viewBox="0 0 24 24" fill="#F7ECD9" aria-hidden="true">
      <path d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
    </svg>
    <div class="splash-title">Gestion Formation</div>
    <div class="splash-subtitle">Plateforme de gestion de formations</div>
    <div class="spinner" role="progressbar" aria-label="Chargement"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var splash = document.getElementById('splash-screen');
      function masquer() {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', masquer);
      // Filet de securite : ne jamais laisser le splash masquer une erreur.
      setTimeout(masquer, 30000);
    })();
  </script>
</body>
</html>
