name: gestion
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  supabase_flutter: ^2.8.0
  flutter_svg: ^2.3.0
  connectivity_plus: ^7.2.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_courslibre.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_gf.jpeg"
  min_sdk_android: 21